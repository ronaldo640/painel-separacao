<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-animate { animation: fadeInDown 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-600 selection:text-white">

    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none"></div>

    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-lg">

                            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-600 via-orange-500 to-amber-400 flex items-center justify-center shadow-md shadow-amber-500/20">

                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                    </svg>
                    <span id="btnPdfText">Gerar PDF</span>

                    <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                    </svg>
                    <span>Banco de Dados (<span id="headerRowCount">0</span>)</span>
                </button>
            </div>
        </div>

            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-3">
                    
                    <div class="flex items-center gap-1.5">
                        <span class="text-xs font-semibold text-slate-400">Mês:</span>

                            <option value="ALL">Todos os Meses</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <span class="text-xs font-semibold text-slate-400">Filial:</span>
                        <select id="filterFilial" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-amber-500 outline-none cursor-pointer">

                            <option value="PAULICOMP SP">PAULICOMP SP</option>
                            <option value="PAULICOMP SUL">PAULICOMP SUL</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <span class="text-xs font-semibold text-slate-400">Curva:</span>

                            <option value="Classe B">Classe B (Médio Giro)</option>
                            <option value="Classe C">Classe C (Baixo Giro)</option>
                        </select>
                    </div>

                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Buscar SKU ou Produto..." class="bg-slate-800/90 border border-slate-700 text-white text-xs rounded-md pl-8 pr-3 py-1.5 focus:ring-2 focus:ring-amber-500 outline-none w-52">
                        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
